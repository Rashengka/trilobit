# The database to develop and test against.
#
# There is one tested target and it is MariaDB 11 LTS. Not "MySQL or MariaDB":
# the generated DDL differs between them and Doctrine has a separate platform
# for each, so claiming both would mean neither had been checked. What is
# tested is what the documentation says, and this file is what it is tested on.
#
#   docker compose up -d
#
# Every value comes from .env, the same file the application reads, so the two
# cannot drift apart. The port is published because the application runs on the
# host rather than in a container here.
#
# The published port is 13306 and not 3306 on purpose. A developer machine
# usually already runs a database on the standard port, so claiming it would
# fail to start at best - and at worst the application would reach that other
# database instead of this one, where the suites create and drop schemas of
# their own. config/common.neon names the same number beside it; the two have
# to move together. Set TRILOBIT_DB_PORT in .env to use a different one.

services:
    database:
        image: mariadb:11.8
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${TRILOBIT_DB_NAME:-trilobit}
            MARIADB_USER: ${TRILOBIT_DB_USER:-trilobit}
            MARIADB_PASSWORD: ${TRILOBIT_DB_PASSWORD:-trilobit}
            # Only docker/mariadb/init uses it, to widen the application
            # user's grant far enough that the suites can make their own
            # schemas. Nothing outside this machine reaches this container.
            MARIADB_ROOT_PASSWORD: ${TRILOBIT_DB_PASSWORD:-trilobit}
        ports:
            - '${TRILOBIT_DB_PORT:-13306}:3306'
        volumes:
            - database:/var/lib/mysql
            - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 20

    # Where a working copy's mail goes: an SMTP server that delivers nothing
    # and keeps every message, readable in its inbox at http://localhost:18200.
    # It is what the mail settings in .env name when they are left empty -
    # see Trilobit\Core\Mail\Mailers - so an invitation sent while clicking
    # through the administration arrives here and not at the address typed.
    #
    # The image is pinned to a release rather than to latest, so that two
    # machines running this file run the same catcher. The ports are not the
    # standard 1025 and 8025 for the reason the database is not on 3306; the
    # SMTP one is named in Mailers beside it, and the two have to move
    # together. The inbox is on 18200 rather than 18025 because a further
    # checkout of this repository serves its pages on 18000 and up, and 18025
    # would be one of them.
    mailpit:
        image: axllent/mailpit:v1.31.1
        restart: unless-stopped
        ports:
            - '${TRILOBIT_MAIL_PORT:-11025}:1025'
            - '${TRILOBIT_MAILPIT_PORT:-18200}:8025'

volumes:
    database:
