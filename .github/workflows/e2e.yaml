#
# The browser-side suite, in its own job.
#
# It is not a step of `composer check`: that gate has to run without Node at
# all, because it is the one definition of green on the PHP side and T05
# already broke that once by folding a frontend step into it. This job builds
# the frontend and drives a real browser instead, and takes as long as that
# needs to take.
#

name: E2E

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# Keyed on github.ref for the same reason as ci.yaml: a push and a pull request
# for the same commit build different trees (branch head vs. merged into base)
# and must not cancel one another. A cancelled run shows up on a PR as a failed
# check, not as "not run".
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: npm run e2e
    runs-on: ubuntu-latest

    # Signing in is a claim about a database as much as about a browser: the
    # suite runs the migrations, makes itself an account and then signs in as
    # it. The image and the version are the ones ci.yaml uses and the ones
    # compose.yaml starts locally, because a migration is written in the
    # dialect it was generated against.
    services:
      database:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: trilobit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Read by the application both times it starts here: once as the console
      # running the migrations and the account command, and once as the server
      # Playwright puts in front of the browser. There is no .env on a runner,
      # so without these the application would fall back to the defaults in
      # config/common.neon and look for a database that is not there.
      TRILOBIT_DB_HOST: 127.0.0.1
      TRILOBIT_DB_PORT: '3306'
      TRILOBIT_DB_NAME: trilobit
      TRILOBIT_DB_USER: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_mysql

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # var/build/modules.json is generated, not committed (it is derived from
      # config/modules.neon), so the build has nothing to read without this -
      # see vite.config.ts.
      - name: Write the build manifest
        run: php bin/trilobit app:warmup

      - run: npm run build

      # A developer's machine points playwright.config.ts at its own installed
      # Chrome (channel: 'chrome'), so nothing is downloaded there. A runner has
      # no such browser - the config leaves the channel unset whenever CI is
      # set, which selects Playwright's own build, installed here.
      - run: npx playwright install --with-deps chromium
        env:
          CI: 'true'

      - name: npm run e2e
        run: npm run e2e
        env:
          CI: 'true'

      # The whole point of this job: a failing run is unreadable without a
      # trace. playwright.config.ts keeps one per failed test (retain-on-failure);
      # this uploads whatever it wrote so a failure can be opened locally with
      # `npx playwright show-trace`.
      - name: Upload the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            test-results/
            playwright-report/
          retention-days: 14
