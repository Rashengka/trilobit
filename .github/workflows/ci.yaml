#
# The gate, on every supported PHP version.
#
# It runs `composer check` and nothing else, so that there is one definition of
# what green means and it lives in composer.json. A workflow that listed the
# steps itself would be a second definition, and the two would drift apart
# without anybody noticing.
#

name: CI

on:
  push:
    # Every branch, because that is where the work happens: a push that runs
    # nothing cannot be called verified, and until this said '**' the gate had
    # never once run on a working branch. '**' matches branches at any depth
    # and, unlike an unfiltered `push`, leaves tags alone.
    branches: ['**']
  pull_request:

permissions:
  contents: read

# Keyed on github.ref, which puts the push and the pull request of one commit in
# separate groups on purpose. They look like the same run over the same code and
# they are not: a push builds the branch head, a pull request builds the branch
# merged into its base. The second is the one that catches "green on the branch,
# broken once master moved underneath it", so cancelling either loses a result
# nobody else produces. Only successive pushes to one ref supersede each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: composer check on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # The database the suites run against. It is the one the application is
    # written for and the one compose.yaml starts locally, because a suite that
    # runs somewhere else is a suite testing a different application: a
    # migration is written in the dialect it was generated against.
    #
    # The suites make a schema of their own per test class, so the account they
    # use has to be allowed to. On a developer's machine that is a narrow grant
    # in docker/mariadb/init; a service container takes no initialisation
    # scripts, so here it is the container's own superuser instead. It lives
    # for the length of one job, answers only inside it, and holds nothing but
    # what these suites put there.
    services:
      database:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: trilobit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_mysql
          ini-values: zend.assertions=1

      - uses: ramsey/composer-install@v3

      # The leak guard refuses to report success without its list of private
      # patterns, and that list is deliberately not in the repository - a
      # committed list of forbidden words would be the disclosure it prevents.
      #
      # On a run that can see the secret the real list is used. On one that
      # cannot - a pull request from a fork - a placeholder keeps the structural
      # rules running and the step says out loud which half did not, so that a
      # green tick is never mistaken for the full check. The half that cannot
      # run here is the half the pre-commit hook already ran on the machine the
      # commit was written on.
      - name: Configure the leak guard
        env:
          PATTERNS: ${{ secrets.CHECK_LEAKS_LOCAL }}
        run: |
          mkdir -p "$HOME/.config/trilobit"
          if [ -n "$PATTERNS" ]; then
            printf '%s\n' "$PATTERNS" > "$HOME/.config/trilobit/check-leaks.local"
          else
            echo "::warning::CHECK_LEAKS_LOCAL is not available to this run; only the structural rules will run."
            # The guard refuses to report success on an empty list, so the file
            # needs one pattern - and it has to be one that cannot occur in the
            # repository. A literal placeholder cannot: whatever is written here
            # is also written in this file, so the pattern would find its own
            # definition and fail every run without the secret, which is exactly
            # the run this branch exists to keep going.
            printf 'no-private-pattern-list-%s-%s\n' "$(date +%s%N)" "${RANDOM}${RANDOM}" \
              > "$HOME/.config/trilobit/check-leaks.local"
          fi

      # Without these the suites that need a database would skip, and a skipped
      # test is a claim that quietly stopped being made.
      - name: composer check
        env:
          TRILOBIT_DB_HOST: 127.0.0.1
          TRILOBIT_DB_PORT: '3306'
          TRILOBIT_DB_NAME: trilobit
          TRILOBIT_DB_USER: root
        run: composer check
