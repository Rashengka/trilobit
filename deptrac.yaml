#
# Which part of the source may know about which other part.
#
# The rule this file exists for is that no optional module may reach into
# another one: a build without Crm has to keep working, and it cannot if Shop
# refers to a Crm class. Grep would not do - it cannot tell a mention in a
# comment from a real dependency, and it misses a fully qualified name used
# without an import. deptrac reads the syntax tree instead.
#
# --fail-on-uncovered turns a directory nobody wrote a rule for into a failure,
# so a new module cannot arrive without one. That flag catches a class in no
# layer; tests/Architecture/DeptracCoversEverythingTest catches the other half
# of the same mistake, a layer with no line in the ruleset - which deptrac
# reads as "may depend on nothing" and therefore lets past.
#

deptrac:
  paths:
    - ./src
    - ./tests

  layers:
    # Everything under src/Core except the one file named below, which is its
    # own layer instead - a class cannot usefully sit in two layers at once
    # (deptrac warns about exactly that and picks one for you), so the
    # exclusion has to be written into this collector rather than left for the
    # more specific layer to override.
    - name: Core
      collectors:
        - type: directory
          value: src/Core/(?!Event/Dispatcher\.php).*

    # Core's own PSR-14 dispatcher, named on its own so that a module reaching
    # for it directly can be told apart from a module reaching for the rest of
    # Core: the two are otherwise the same directory. See the class docblock
    # of Trilobit\Core\Event\Dispatcher for why a module has to use a port
    # instead of dispatching an event another module listens for.
    - name: CoreEventDispatcher
      collectors:
        - type: directory
          value: src/Core/Event/Dispatcher\.php

    # One layer per switchable module. They are listed in full rather than
    # collected by a pattern, because a module appearing here is meant to be a
    # line somebody wrote on purpose.
    - name: Cms
      collectors:
        - type: directory
          value: src/Cms/.*

    - name: Crm
      collectors:
        - type: directory
          value: src/Crm/.*

    - name: Shop
      collectors:
        - type: directory
          value: src/Shop/.*

    # One layer per module's own suites, mirroring the layers above. A suite
    # is allowed to name the module it is about and Core, and nothing else of
    # ours - so a test written for one module that reaches for another fails
    # here exactly as the module itself would. Without this, either every
    # suite could name every module, or no suite could name any.
    #
    # The directories need not exist: a module whose suites are still to be
    # written has an empty layer, which is the state the rule has to be
    # written down in if it is to be there on the day somebody adds the first
    # file.
    - name: CmsTests
      collectors:
        - type: directory
          value: tests/[A-Za-z0-9_]+/Cms/.*

    - name: CrmTests
      collectors:
        - type: directory
          value: tests/[A-Za-z0-9_]+/Crm/.*

    - name: ShopTests
      collectors:
        - type: directory
          value: tests/[A-Za-z0-9_]+/Shop/.*

    # Everything else under tests/. They may use the application; the
    # application may not use them, and that is the only claim about them
    # worth enforcing here. The module suites above are excluded rather than
    # left to overlap - a class cannot usefully sit in two layers at once.
    - name: Tests
      collectors:
        - type: directory
          value: tests/(?![A-Za-z0-9_]+/(?:Cms|Crm|Shop)/).*

    # Everything that is not ours. Without this layer --fail-on-uncovered would
    # report every use of Nette or PHPUnit, and the flag would have to be
    # turned off - which is the flag that makes a module without a rule fail.
    - name: Vendor
      collectors:
        - type: bool
          must_not:
            - type: classLike
              value: ^Trilobit\\.*

  ruleset:
    # Core may know libraries, and its own dispatcher, and nothing else of
    # ours. The absence of a module here is the rule: the moment one is
    # added, a module has been named inside Core.
    Core:
      - Vendor
      - CoreEventDispatcher

    # A module may know Core and libraries. It may not know another module:
    # that is the rule this file exists for, and it is expressed by what is
    # absent from these three lines. It may not know the dispatcher either -
    # that omission is the rule CoreEventDispatcher exists for, and it is
    # expressed the same way, by what is absent.
    Cms:
      - Core
      - Vendor
    Crm:
      - Core
      - Vendor
    Shop:
      - Core
      - Vendor

    # A module's suites may name that module, Core, the shared test harness
    # under tests/ - the boot, the database, the doubles - and libraries. What
    # is absent is another module, which is the whole reason these three
    # layers exist rather than one.
    CmsTests:
      - Cms
      - Core
      - Tests
      - Vendor
    CrmTests:
      - Core
      - Crm
      - Tests
      - Vendor
    ShopTests:
      - Core
      - Shop
      - Tests
      - Vendor

    Tests:
      - Core
      - Vendor
      - CoreEventDispatcher
    Vendor: ~
    CoreEventDispatcher:
      - Vendor
